<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GrantAI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="shape shape-pink" aria-hidden="true"></div>
    <div class="shape shape-yellow" aria-hidden="true"></div>
    <div class="shape shape-teal" aria-hidden="true"></div>

    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" aria-label="GrantAI home">
            <span class="brand-mark">GA</span>
            <span>
                <strong>GrantAI</strong>
                <small>Grant Assistant</small>
            </span>
        </a>

        <button class="nav-toggle" type="button" data-nav-toggle aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="site-nav" data-site-nav aria-label="Main navigation">
            {% for item in nav_items %}
                <a class="{% if active_page == item.endpoint %}is-active{% endif %}" href="{{ url_for(item.endpoint) }}">
                    {{ item.label }}
                </a>
            {% endfor %}
        </nav>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p><strong>POC</strong> — Fit scores are estimates. Verify grants on official sites. Proposal downloads as PDF.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
